# @package _global_
vla_path: openvla/openvla-7b

data:
  root_dir: ~/tensorflow_datasets
  dataset_name: go_vla_dataset
  shuffle_buffer_size: 100000
  image_aug: true

training:
  batch_size: 4
  epochs: 100
  learning_rate: 2e-5
  grad_accumulation_steps: 32
  gradient_checkpointing: false
  val_steps: 100
  resume_checkpoint_steps: 500

lora:
  enabled: true
  rank: 32
  dropout: 0.0
  quantization: false

resume_from: null  # path to resume/ dir from a previous run
warm_start_from: null # optional path to checkpoints/latest or checkpoints/best for a fresh run

wandb:
  project: openvla-masked
  entity: m-w-jarosz-team-epoch
  run_name: null
