# @package _global_
vla_path: IPEC-COMMUNITY/spatialvla-4b-224-pt

data:
  root_dir: ~/tensorflow_datasets
  dataset_name: go_vla
  shuffle_buffer_size: 100000
  image_aug: true

training:
  batch_size: 32
  epochs: 50
  learning_rate: 5e-4
  grad_accumulation_steps: 1
  gradient_checkpointing: true
  val_steps: 250
  save_steps: 500

lora:
  enabled: true
  rank: 32
  alpha: 32
  target: linear
  quantization: true

action:
  mask_rotation_loss: true
  action_forward_steps: 3

wandb:
  project: vla-models
  entity: null
  run_name: null
